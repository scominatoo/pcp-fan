# Proxy reverso PCP Homologacao — pcp.synnex.com.br
#
# Fluxo:
#   Internet → OPNsense (HTTPS) → este servidor :80 (nginx)
#     /api/*  → NestJS em 127.0.0.1:3000
#     /*      → Frontend Vite preview em 127.0.0.1:5175

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pcp.synnex.com.br;

    access_log /var/log/nginx/pcp-synnex.access.log;
    error_log  /var/log/nginx/pcp-synnex.error.log;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location = /api {
        return 301 /api/;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
