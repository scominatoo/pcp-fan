# Proxy reverso PCP Homologacao — pcp.synnex.com.br
#
# Fluxo:
#   Internet → OPNsense (HTTPS) → este servidor :80 (nginx)
#     /api/*  → NestJS em 127.0.0.1:3000
#     /*      → arquivos estáticos do frontend (build do Vite) em /var/www/pcp-web
#
# O scripts/deploy.sh copia pcp-homol-web/dist para /var/www/pcp-web.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pcp.synnex.com.br;

    access_log /var/log/nginx/pcp-synnex.access.log;
    error_log  /var/log/nginx/pcp-synnex.error.log;

    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location = /api {
        return 301 /api/;
    }

    root /var/www/pcp-web;

    # Arquivos com hash no nome (gerados pelo Vite) — cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do React (ex.: /ordens-producao/123) caem no index.html.
    # index.html sem cache para o navegador pegar a versão nova após deploy.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
        try_files $uri $uri/ /index.html;
    }
}
