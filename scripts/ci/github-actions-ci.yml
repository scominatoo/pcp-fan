name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (build + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcp
          POSTGRES_PASSWORD: pcp
          POSTGRES_DB: pcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pcp -d pcp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pcp:pcp@localhost:5432/pcp_test?schema=public
    defaults:
      run:
        working-directory: pcp-homol-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcp-homol-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcp-homol-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcp-homol-web/package-lock.json
      - run: npm ci
      - run: npm run build
